name: FeelsFinder
options:
  bundleIdPrefix: com.brianhubbell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: M64T9MW7V8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FeelsFinder:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    entitlements:
      path: Resources/FeelsFinder.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianhubbell.FeelsFinder
        PRODUCT_NAME: FeelsFinder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Feels Finder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # zlib only, no cryptography — stops the export-compliance prompt on every upload
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ICLOUD_BACKUP
        ENABLE_USER_SCRIPT_SANDBOXING: YES
