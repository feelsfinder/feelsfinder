name: FeelsFinder
options:
  bundleIdPrefix: com.brianhubbell
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: M64T9MW7V8
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FeelsFinder:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - target: FeelsFinderWidget
    entitlements:
      path: Resources/FeelsFinder.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brianhubbell.FeelsFinder]
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianhubbell.FeelsFinder
        PRODUCT_NAME: FeelsFinder
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Feels Finder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Feels Finder saves the feeling you pick to Apple Health as State of Mind, so other apps you allow can read it.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Feels Finder only writes to Apple Health. It does not read anything.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        # zlib only, no cryptography — stops the export-compliance prompt on every upload
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: ICLOUD_BACKUP
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  FeelsFinderWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Sources/Model/Pick.swift
      - path: Sources/Model/Feeling.swift
      - path: Sources/Model/Stats.swift
      - path: Sources/Model/Pairer.swift
      - path: Sources/Model/Shared.swift
      - path: Sources/Design/Palette.swift
    entitlements:
      path: Widget/FeelsFinderWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.brianhubbell.FeelsFinder]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Feels Finder
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.brianhubbell.FeelsFinder.Widget
        PRODUCT_NAME: FeelsFinderWidget
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
